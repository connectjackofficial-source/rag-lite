[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lite"
version = "0.1.0"
description = "Zero-dependency local retrieval: tokenizer, TF-IDF vectors, inverted index, cosine search, chunking, persistence."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jack"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
rag-lite = "rag_lite.cli:main"

[tool.setuptools]
packages = ["rag_lite"]
